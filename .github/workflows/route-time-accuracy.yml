name: Japan Day Planner - route and hotel repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout current Japan Day Planner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Repair hotel discovery and live route times
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('OdekakeGuide/OdekakeGuide/ChiikawaGuideApp.swift')
          s = p.read_text(encoding='utf-8')
          previous = s

          def change(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one unique match, got {count}. No changes saved.')
              s = s.replace(old, new, 1)

          # Transit: MapKit calculates actual public-transport ETA via calculateETA(),
          # not via unsupported transit route geometry. Return no time if unavailable.
          change(
              '        guard let straight = straightDistance(origin, destination) else { return nil }\n        // MapKit supplies real route length',
              '''        guard let straight = straightDistance(origin, destination) else { return nil }
                  // Apple MapKit supports public-transport ETA, not full transit geometry.
                  if mode == .transit {
                      for attempt in 0..<2 {
                          guard !Task.isCancelled else { return nil }
                          let request = MKDirections.Request()
                          request.source = origin
                          request.destination = destination
                          request.transportType = .transit
                          request.departureDate = Date()
                          if let eta = try? await MKDirections(request: request).calculateETA(),
                             eta.expectedTravelTime.isFinite, eta.expectedTravelTime > 0,
                             eta.expectedTravelTime / 60 < Double(Int.max) {
                              return TravelTime(minutes: max(1, Int(ceil(eta.expectedTravelTime / 60))),
                                                isApproximate: false)
                          }
                          if attempt == 0 { try? await Task.sleep(nanoseconds: 400_000_000) }
                      }
                      return nil
                  }
                  // MapKit supplies real route length''',
              'Use actual transit ETA')

          change(
              '            // Trains use the live Google Maps link rather than invented times.\n            if let w = await travelMinutes(from: origin, to: destination, by: .walking) {',
              '''            // Fetch public-transport ETA when the map service provides one.
                          if let train = await travelMinutes(from: origin, to: destination, by: .transit) {
                              guard !Task.isCancelled, requestKey == hotelTravelKey else { return }
                              hotelTravelMinutes["transit"] = train
                          }
                          if let w = await travelMinutes(from: origin, to: destination, by: .walking) {''',
              'Hotel public-transport time')

          change(
              '            for (mode, transport) in [("walking", MKDirectionsTransportType.walking),\n                                      ("taxi", MKDirectionsTransportType.automobile)] {',
              '''            for (mode, transport) in [("transit", MKDirectionsTransportType.transit),
                                                ("walking", MKDirectionsTransportType.walking),
                                                ("taxi", MKDirectionsTransportType.automobile)] {''',
              'Sightseeing and meal transit times')

          # A landmark with a known coordinate must never fail just because Apple
          # Maps cannot find a POI under the displayed name.
          change(
              '''                let first = try await firstVenueMapItem(in: prefecture)
                          guard hotelSearchID == token else { return }
                          guard let first else {
                              hotelSearching = false; hotelSearchError = hotelResults.isEmpty; return
                          }
                          let coordinate = first.placemark.coordinate''',
              '''                let coordinate: CLLocationCoordinate2D
                          if let pinned = pinnedFirstVenueCoordinate {
                              coordinate = pinned
                          } else if let first = try await firstVenueMapItem(in: prefecture) {
                              coordinate = first.placemark.coordinate
                          } else {
                              hotelSearching = false
                              hotelSearchError = hotelResults.isEmpty
                              return
                          }
                          guard hotelSearchID == token else { return }''',
              'Verified destination anchor for hotel lookup')

          # Reduce repeated network searches (throttling), enlarge radius by need.
          change('for radius in [2000.0, 5000.0, 10000.0, 25000.0, 50000.0]',
                 'for radius in [2500.0, 8000.0, 20000.0, 40000.0]', 'Efficient nearby hotel radius')
          change('for term in ["ホテル", "旅館", "宿泊施設"]',
                 'for term in ["ホテル", "旅館"]', 'Avoid redundant hotel requests')

          # If generic hotel map results are sparse, resolve registered names to
          # real on-map hotel coordinates and reject results outside the local area.
          change(
              '''                    if suggestions.count >= desiredCount { break }
                          }
                          if !suggestions.isEmpty {''',
              '''                    if suggestions.count >= desiredCount { break }
                          }
                          if suggestions.count < desiredCount {
                              for hotel in registeredHotels().prefix(5) {
                                  guard hotelSearchID == token, !Task.isCancelled else { return }
                                  let request = MKLocalSearch.Request()
                                  request.naturalLanguageQuery = hotel.lookupQuery ?? "\\(hotel.name), \\(hotel.address)"
                                  request.resultTypes = [.address, .pointOfInterest]
                                  request.region = MKCoordinateRegion(center: coordinate,
                                      latitudinalMeters: 80_000, longitudinalMeters: 80_000)
                                  if let response = try? await MKLocalSearch(request: request).start() {
                                      for item in response.mapItems {
                                          guard let name = item.name, !name.isEmpty else { continue }
                                          let point = item.placemark.coordinate
                                          guard CLLocationCoordinate2DIsValid(point) else { continue }
                                          let metres = center.distance(from: CLLocation(
                                              latitude: point.latitude, longitude: point.longitude))
                                          guard metres < 40_000,
                                                (name.localizedCaseInsensitiveContains(hotel.name)
                                                 || hotel.name.localizedCaseInsensitiveContains(name)) else { continue }
                                          let normalized = name.folding(options: [.caseInsensitive, .widthInsensitive], locale: .current)
                                          guard seen.insert(normalized).inserted else { continue }
                                          suggestions.append(HotelSuggestion(id: "resolved|\\(hotel.id)", name: name,
                                              address: hotel.address, latitude: point.latitude,
                                              longitude: point.longitude, phone: hotel.phone,
                                              website: hotel.website, distance: metres,
                                              anchorLatitude: coordinate.latitude,
                                              anchorLongitude: coordinate.longitude))
                                          hotelResults = Array(suggestions.sorted { $0.distance < $1.distance }.prefix(5))
                                          break
                                      }
                                  }
                                  if suggestions.count >= desiredCount { break }
                              }
                          }
                          if !suggestions.isEmpty {''',
              'Confirm registered nearby hotels using actual map locations')

          # Do not confuse an arbitrary 25-minute planning allowance with
          # route timings computed by the actual map engine.
          change(
              '''            Text(String(format: extra("planningGap"), locale: language.locale, arguments: [route.gap]))
                          .font(.caption).foregroundStyle(.secondary)
                      routeLinks(origin: venueQuery(from), destination: venueQuery(to))''',
              '            routeLinks(origin: venueQuery(from), destination: venueQuery(to))',
              'Remove misleading preset time from direction card')
          change('"findHotels": ["出発地近くのホテルを探す",',
                 '"findHotels": ["地図から近くのホテルを探す（最大5件）",',
                 'Show the repaired hotel search on screen')
          change('"estimateNote": ["表示する時間は取得できた地図経路に基づきます。取得できない場合はGoogleマップで確認してください。電車はGoogleマップで所要時間を確認できます。",',
                 '"estimateNote": ["徒歩・車は地図経路、電車は公共交通の到着予測から取得します。取得できない場合はGoogleマップで確認してください。",',
                 'Describe true map source of displayed travel time')

          assert s != previous
          assert 'calculateETA()' in s
          assert '("transit", MKDirectionsTransportType.transit)' in s
          assert '地図から近くのホテルを探す（最大5件）' in s
          p.write_text(s, encoding='utf-8')
          print('Updated travel-time and hotel source:', len(s), 'characters')
          PYTHON
          git diff --check
          git diff --stat

      - name: Compile repaired app before committing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OdekakeGuide.xcodeproj \
            -scheme OdekakeGuide \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Save repaired Swift after successful compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OdekakeGuide/OdekakeGuide/ChiikawaGuideApp.swift
          if git diff --cached --quiet; then
            echo 'No source change; nothing to commit.'
          else
            git commit -m 'Repair actual transit ETAs and hotel search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
