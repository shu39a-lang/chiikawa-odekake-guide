name: Japan Day Planner - Google API iPhone integration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout current Japan Day Planner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Integrate Places Routes and Firebase app config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, pathlib, zipfile, io, shutil, plistlib
          payload = ""
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(payload)))
          target=pathlib.Path('/tmp/japan_day_google_v6')
          target.mkdir(parents=True,exist_ok=True)
          z.extractall(target)
          plist=target/'config/GoogleService-Info.plist'
          with plist.open('rb') as f: config=plistlib.load(f)
          assert config['BUNDLE_ID']=='com.shu39a.odekakeguide', 'wrong bundle ID'
          assert config['PROJECT_ID']=='japan-day-plan','wrong Firebase project'
          dest=pathlib.Path('OdekakeGuide/OdekakeGuide/GoogleService-Info.plist')
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(plist,dest)
          print('Firebase client config: correct project and bundle; contents not printed.')
          import subprocess
          subprocess.run(['python3',str(target/'integrate_google.py')],check=True)
          PYTHON
          git diff --check
          swiftc -frontend -parse OdekakeGuide/OdekakeGuide/ChiikawaGuideApp.swift
          plutil -lint OdekakeGuide/OdekakeGuide/GoogleService-Info.plist
      - name: Compile complete iOS app before saving
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project OdekakeGuide.xcodeproj -scheme OdekakeGuide \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Commit only after successful compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OdekakeGuide/OdekakeGuide/ChiikawaGuideApp.swift \
            OdekakeGuide/OdekakeGuide/GoogleService-Info.plist \
            OdekakeGuide/OdekakeGuide/JapanDayPlanner.entitlements \
            OdekakeGuide.xcodeproj/project.pbxproj codemagic.yaml
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'Integrate Google Places and Routes with verified Firebase client config'
          git pull --rebase origin main
          git push origin HEAD:main
