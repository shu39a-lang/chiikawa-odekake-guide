workflows:
  ios-release:
    name: Japan Day Planner iPhone build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic7
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.odekakeguide
    scripts:
      - name: アプリアイコンとビルド番号を設定
        script: |
          python3 <<'PY'
          import json, os, struct, shutil
          from pathlib import Path

          catalog = Path('OdekakeGuide/OdekakeGuide/Assets.xcassets/AppIcon.appiconset')
          catalog.mkdir(parents=True, exist_ok=True)
          shutil.copyfile('AppIcon.png', catalog / 'AppIcon.png')
          png = (catalog / 'AppIcon.png').read_bytes()
          assert png[:8] == bytes([137,80,78,71,13,10,26,10]), 'Invalid icon PNG'
          assert struct.unpack('!II', png[16:24]) == (1024, 1024), 'Icon must be 1024x1024'
          assert png[25] == 2, 'Icon must be opaque RGB'
          (catalog / 'Contents.json').write_text(json.dumps({
              'images': [{'filename': 'AppIcon.png', 'idiom': 'universal', 'platform': 'ios', 'size': '1024x1024'}],
              'info': {'author': 'xcode', 'version': 1}
          }))

          project = Path('OdekakeGuide.xcodeproj/project.pbxproj')
          content = project.read_text()
          def change(old, new, count):
              global content
              assert content.count(old) == count, f'Xcode project mismatch: {old}'
              content = content.replace(old, new)
          change('  A10000000000000000000001 = {isa = PBXBuildFile; fileRef = A10000000000000000000011; };',
                 '  A10000000000000000000001 = {isa = PBXBuildFile; fileRef = A10000000000000000000011; };\n  A10000000000000000000002 = {isa = PBXBuildFile; fileRef = A10000000000000000000012; };', 1)
          change('  A10000000000000000000011 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ChiikawaGuideApp.swift; sourceTree = "<group>"; };',
                 '  A10000000000000000000011 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ChiikawaGuideApp.swift; sourceTree = "<group>"; };\n  A10000000000000000000012 = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };', 1)
          change('children = (A10000000000000000000011,);',
                 'children = (A10000000000000000000011, A10000000000000000000012,);', 1)
          change('   files = ();\n   runOnlyForDeploymentPostprocessing = 0;\n  };\n  A10000000000000000000032',
                 '   files = (A10000000000000000000002,);\n   runOnlyForDeploymentPostprocessing = 0;\n  };\n  A10000000000000000000032', 1)
          change('    CODE_SIGN_STYLE = Automatic;',
                 '    ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n    CODE_SIGN_STYLE = Automatic;', 2)
          change('    INFOPLIST_KEY_CFBundleDisplayName = "おでかけガイド";',
                 '    INFOPLIST_KEY_CFBundleDisplayName = "Japan Day Planner";', 2)
          change('    MARKETING_VERSION = 0.1.0;', '    MARKETING_VERSION = 1.0;', 2)
          build_number = os.environ['BUILD_NUMBER']
          assert build_number.isdigit()
          change('    CURRENT_PROJECT_VERSION = 1;',
                 f'    CURRENT_PROJECT_VERSION = {build_number};', 2)
          project.write_text(content)
          PY
      - name: 署名プロファイルを設定
        script: xcode-project use-profiles
      - name: iPhone用IPAを作成
        script: |
          xcode-project build-ipa \
            --project OdekakeGuide.xcodeproj \
            --scheme OdekakeGuide
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration

