workflows:
  ios-release:
    name: iPhone版ビルド
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.odekakeguide
    scripts:
      - name: 署名プロファイルを設定
        script: xcode-project use-profiles
      - name: iPhone用IPAを作成
        script: |
          xcode-project build-ipa \
            --project OdekakeGuide.xcodeproj \
            --scheme OdekakeGuide
    artifacts:
      - build/ios/ipa/*.ipa
